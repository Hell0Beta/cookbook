<div class="flex gap-2">
<button class="p-1 border border-outline-variant rounded text-on-surface-variant bg-surface"><span class="material-symbols-outlined text-sm" data-icon="chevron_left">chevron_left</span></button>
<button class="p-1 border border-outline-variant rounded text-on-surface-variant bg-surface"><span class="material-symbols-outlined text-sm" data-icon="chevron_right">chevron_right</span></button>
</div>
</div>
<!-- Weekly Bento Grid (Mobile View) -->
<div class="grid grid-cols-4 gap-grid-base mb-6 overflow-x-auto pb-2">
<!-- Day Cell: Past -->
<div class="flex flex-col border border-outline-variant rounded bg-surface p-2 text-center opacity-60 min-w-[64px]">
<span class="font-label-mono text-label-mono text-on-surface-variant">Mon</span>
<span class="font-body-md text-body-md font-bold mt-1">16</span>
<div class="mt-2 h-1 w-full bg-surface-container-high rounded"></div>

<div class="absolute -top-1 -right-1 w-2 h-2 bg-primary-container rounded-full"></div>
<span class="font-label-mono text-label-mono text-primary-container">Tue</span>
<span class="font-body-md text-body-md font-bold text-espresso-brown mt-1">17</span>

<div class="w-2 h-2 rounded-full bg-secondary-fixed"></div>
<div class="w-2 h-2 rounded-full bg-secondary-fixed"></div>
</div>
</div>

<div class="mt-2 h-1 w-full border-t border-dashed border-outline-variant"></div>
</div>
</div>
